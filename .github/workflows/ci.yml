name: CI

on:
  pull_request:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          npm install
          npm install -D @rollup/rollup-linux-x64-gnu
          for d in sites/*/; do
            if [ -f "$d/package.json" ]; then
              (cd "$d" && npm install -D @rollup/rollup-linux-x64-gnu)
            fi
          done
      - name: Build
        run: npm run build
